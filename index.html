<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FX Centrum24 | Global Markets</title>

  <meta
    name="description"
    content="FX Centrum24 provides access to global financial markets through professional trading platforms."
  />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #050914;
      color: #ffffff;
      min-height: 100vh;
    }

    .test-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
      background:
        radial-gradient(circle at 50% 30%, rgba(0, 120, 255, 0.18), transparent 35%),
        #050914;
    }

    .test-content h1 {
      font-size: clamp(40px, 7vw, 80px);
      font-weight: 800;
      letter-spacing: -3px;
      margin-bottom: 20px;
    }

    .test-content p {
      color: #9da8ba;
      font-size: 18px;
      max-width: 650px;
      line-height: 1.7;
      margin: auto;
    }

    .badge {
      display: inline-block;
      margin-bottom: 25px;
      padding: 8px 16px;
      border: 1px solid rgba(70, 150, 255, 0.35);
      border-radius: 50px;
      color: #65a9ff;
      background: rgba(40, 120, 255, 0.08);
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <main class="test-screen">
    <div class="test-content">

      <div class="badge">
        FX CENTRUM24 • GLOBAL MARKETS
      </div>

      <h1>
        FX Centrum24
      </h1>

      <p>
        The new international trading experience is being built here.
        Professional markets. Powerful platforms. One global experience.
      </p>

    </div>
  </main>

</body>
</html>
