name: Mobile navigation finalize
on:
  push:
    paths:
      - '.github/workflows/mobile-nav-finalize.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile navigation
        shell: python
        run: |
          from pathlib import Path
          p = Path('site-fixes.js')
          text = p.read_text(encoding='utf-8')
          marker = "\n/* FXC MOBILE NAV FINAL HOTFIX */\n"
          if marker not in text:
              code = r'''\n/* FXC MOBILE NAV FINAL HOTFIX */\n(() => {\n  if (window.__fxcMobileNavFinalHotfix) return;\n  window.__fxcMobileNavFinalHotfix = true;\n\n  const style = document.createElement('style');\n  style.id = 'fxc-mobile-nav-final-hotfix-style';\n  style.textContent = `\n    @media (max-width:850px) {\n      .site-header { position:sticky !important; top:0 !important; z-index:5000 !important; }\n      .main-nav { position:fixed !important; z-index:5100 !important; background:#04101d !important; opacity:1 !important; visibility:visible; }\n      .main-nav.is-open, .main-nav.open { transform:translateX(0) !important; }\n      .main-nav .dropdown { display:none !important; visibility:hidden !important; opacity:0 !important; }\n      .main-nav .nav-item.is-open > .dropdown,\n      .main-nav .nav-item.open > .dropdown { display:block !important; visibility:visible !important; opacity:1 !important; transform:none !important; }\n      .menu-toggle, .nav-trigger { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }\n      body.menu-open { overflow:hidden !important; }\n    }\n  `;\n  document.head.appendChild(style);\n\n  const isMobile = () => window.innerWidth <= 850;\n  document.addEventListener('click', (event) => {\n    if (!isMobile()) return;\n    const toggle = event.target.closest('.menu-toggle');\n    if (toggle) {\n      event.preventDefault();\n      event.stopImmediatePropagation();\n      const nav = document.querySelector('.main-nav');\n      if (!nav) return;\n      const open = !(nav.classList.contains('is-open') || nav.classList.contains('open'));\n      nav.classList.toggle('is-open', open);\n      nav.classList.toggle('open', open);\n      toggle.setAttribute('aria-expanded', String(open));\n      document.body.classList.toggle('menu-open', open);\n      return;\n    }\n\n    const trigger = event.target.closest('.main-nav .nav-trigger');\n    if (trigger) {\n      event.preventDefault();\n      event.stopImmediatePropagation();\n      const nav = trigger.closest('.main-nav');\n      const item = trigger.closest('.nav-item');\n      if (!nav || !item) return;\n      const open = !(item.classList.contains('is-open') || item.classList.contains('open'));\n      nav.querySelectorAll('.nav-item.is-open, .nav-item.open').forEach(other => {\n        if (other !== item) {\n          other.classList.remove('is-open','open');\n          const t = other.querySelector('.nav-trigger');\n          if (t) t.setAttribute('aria-expanded','false');\n        }\n      });\n      item.classList.toggle('is-open', open);\n      item.classList.toggle('open', open);\n      trigger.setAttribute('aria-expanded', String(open));\n    }\n  }, true);\n})();\n'''
              text += code
              p.write_text(text, encoding='utf-8')

          css = Path('styles.css')
          s = css.read_text(encoding='utf-8')
          css_marker = '/* FXC MOBILE NAV CSS FINAL */'
          if css_marker not in s:
              s += '''\n\n/* FXC MOBILE NAV CSS FINAL */\n@media (max-width:850px){\n  .site-header{z-index:5000 !important;position:sticky !important;top:0 !important;}\n  .main-nav{z-index:5100 !important;background:#04101d !important;opacity:1 !important;}\n  .main-nav.is-open,.main-nav.open{transform:translateX(0) !important;}\n  .main-nav .dropdown{display:none !important;}\n  .main-nav .nav-item.is-open>.dropdown,.main-nav .nav-item.open>.dropdown{display:block !important;opacity:1 !important;visibility:visible !important;}\n}\n'''
              css.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-fixes.js styles.css
          git rm -f .github/workflows/mobile-nav-finalize.yml
          git commit -m 'Finalize mobile navigation fixes [skip ci]' || true
          git push