name: Fix duplicate homepage footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-footer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove legacy footer on homepage
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          text = index.read_text(encoding="utf-8")

          css = '''\n    /* Homepage footer consolidation: keep only the new GO COIIN footer. */\n    footer:not(.home-footer), .site-footer { display: none !important; }\n'''
          if css.strip() not in text:
              text = text.replace("</style>", css + "  </style>", 1)
              index.write_text(text, encoding="utf-8")

          fixes = Path("site-fixes.js")
          js = fixes.read_text(encoding="utf-8")
          function_block = '''\n  function removeLegacyHomepageFooter() {\n    if (path !== '/' && !/\\/index\\.html$/i.test(path)) return;\n    document.querySelectorAll('footer:not(.home-footer), .site-footer').forEach(el => el.remove());\n  }\n'''
          if "removeLegacyHomepageFooter" not in js:
              js = js.replace("  function setHeaderHeight()", function_block + "\n  function setHeaderHeight()", 1)
              js = js.replace("function init(){applyGoCoiinBrand();fixLinks();fixFooterLinks();installMobileNavigation();neutralizePlaceholderSocials();setTimeout(()=>{applyGoCoiinBrand();fixLinks();fixFooterLinks();neutralizePlaceholderSocials()},250)}", "function init(){applyGoCoiinBrand();fixLinks();fixFooterLinks();removeLegacyHomepageFooter();installMobileNavigation();neutralizePlaceholderSocials();setTimeout(()=>{applyGoCoiinBrand();fixLinks();fixFooterLinks();removeLegacyHomepageFooter();neutralizePlaceholderSocials()},250)}")
              fixes.write_text(js, encoding="utf-8")

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-double-footer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove duplicate homepage footer"
          git push
