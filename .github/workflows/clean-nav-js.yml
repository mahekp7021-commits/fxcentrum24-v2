name: Clean mobile navigation JavaScript
on:
  push:
    paths:
      - '.github/workflows/clean-nav-js.yml'
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean literal escapes
        shell: python
        run: |
          from pathlib import Path
          p = Path('site-fixes.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* FXC MOBILE NAV FINAL HOTFIX */'
          if marker in text:
              head, suffix = text.split(marker, 1)
              suffix = suffix.replace(r'\\n', '\n')
              text = head + marker + suffix
          p.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-fixes.js
          git rm -f .github/workflows/clean-nav-js.yml
          git commit -m 'Clean mobile navigation JavaScript escaping [skip ci]' || true
          git push