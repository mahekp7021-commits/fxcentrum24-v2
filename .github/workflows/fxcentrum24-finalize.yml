name: FXCentrum24 Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production completion fixes
        shell: python
        run: |
          from pathlib import Path
          import html
          import os
          import re
          import json

          ROOT = Path('.')
          HTML_FILES = sorted(ROOT.rglob('*.html'))
          ROUTES = {
              'Forex':'markets/forex.html','Commodities':'markets/commodities.html','Indices':'markets/indices.html','Shares CFDs':'markets/shares-cfds.html','Shares':'markets/shares-cfds.html','Cryptocurrency':'markets/cryptocurrency.html',
              'Trade Forex':'markets/forex.html','Trade Commodities':'markets/commodities.html','Trade Indices':'markets/indices.html','Trade Shares':'markets/shares-cfds.html','Trade Crypto':'markets/cryptocurrency.html',
              'Account Types':'trading/account-types.html','Trading Conditions':'trading/trading-conditions.html','Platforms':'trading/platforms.html','How to Start':'trading/how-to-start.html',
              'MetaTrader 4':'platforms/metatrader-4.html','MetaTrader 5':'platforms/metatrader-5.html','WebTrader':'platforms/webtrader.html',
              'Standard':'accounts/standard.html','Premium':'accounts/premium.html','Professional':'accounts/professional.html',
              'Live Markets':'tools/live-markets.html','Economic Calendar':'tools/economic-calendar.html','About Us':'company/about.html','Contact Us':'company/contact.html','Benefits':'company/benefits.html',
              'Partnership':'partnership/index.html','Become a Partner':'partnership/account-opening.html','Open Account':'trading/account-opening.html','Open Account Now':'trading/account-opening.html',
              'Terms and Conditions':'legal/terms-and-conditions.html','Terms & Conditions':'legal/terms-and-conditions.html','Privacy Policy':'legal/privacy-policy.html','Risk Disclosure':'legal/risk-disclosure.html','AML Policy':'legal/aml-policy.html','Client Agreement':'legal/client-agreement.html',
              'Explore All Markets':'tools/live-markets.html','View All Markets':'tools/live-markets.html'
          }
          LEGAL_BY_LABEL = {k.lower():v for k,v in {'Terms and Conditions':'legal/terms-and-conditions.html','Privacy Policy':'legal/privacy-policy.html','Risk Disclosure':'legal/risk-disclosure.html','AML Policy':'legal/aml-policy.html','Client Agreement':'legal/client-agreement.html'}.items()}

          def context_dir(path):
              return ROOT if path.as_posix().startswith('sections/') else path.parent
          def rel_route(current,target):
              rel=os.path.relpath(ROOT/target,context_dir(current)).replace('\\\\','/')
              return rel if rel.startswith('.') else './'+rel
          def clean_text(value):
              value=re.sub(r'<[^>]+>',' ',value); value=html.unescape(value); return re.sub(r'\\s+',' ',value).strip()
          anchor_re=re.compile(r'<a\\b(?P<attrs>[^>]*)>(?P<body>.*?)</a>',re.I|re.S)
          href_re=re.compile(r'\\bhref\\s*=\\s*([\"\\'])(.*?)\\1',re.I|re.S)
          aria_re=re.compile(r'\\baria-label\\s*=\\s*([\"\\'])(.*?)\\1',re.I|re.S)
          class_re=re.compile(r'\\bclass\\s*=\\s*([\"\\'])(.*?)\\1',re.I|re.S)
          def rewrite_anchor(match,path):
              attrs=match.group('attrs'); body=match.group('body'); text=clean_text(body)
              am=aria_re.search(attrs); aria=am.group(2).strip() if am else ''
              hm=href_re.search(attrs); href=hm.group(2).strip() if hm else None
              cm=class_re.search(attrs); classes=cm.group(2).lower() if cm else ''
              label=(aria or text).strip(); label_key=re.sub(r'\\s+',' ',label.lower())
              if label_key=='login' or 'btn-login' in classes or (href and 'login' in href.lower()): return ''
              if href=='#' and label_key in {'facebook','x','linkedin','youtube','instagram'}:
                  attrs=href_re.sub('',attrs,count=1).rstrip()+' aria-disabled="true" tabindex="-1"'
                  return f'<a{attrs}>{body}</a>'
              if href and re.search(r'(^|/)terms\\.html$',href,re.I): target='legal/terms-and-conditions.html'
              elif href and re.search(r'(^|/)privacy\\.html$',href,re.I): target='legal/privacy-policy.html'
              else:
                  target=ROUTES.get(label) or LEGAL_BY_LABEL.get(label_key)
              if target is None and href and href.startswith('#'):
                  target={
                      'accounts':'trading/account-types.html','conditions':'trading/trading-conditions.html','platforms':'trading/platforms.html','steps':'trading/how-to-start.html',
                      'markets':'tools/live-markets.html','calendar':'tools/economic-calendar.html','about':'company/about.html','contact':'company/contact.html','partner':'partnership/index.html','open-account':'trading/account-opening.html','benefits':'company/benefits.html'
                  }.get(href[1:].lower())
              if target is not None and (href is None or href.startswith('#') or (href and (href.endswith('/terms.html') or href.endswith('/privacy.html')))):
                  new=rel_route(path,target)
                  attrs=href_re.sub(lambda m:f'href="{new}"',attrs,count=1) if hm else attrs+f' href="{new}"'
                  return f'<a{attrs}>{body}</a>'
              return match.group(0)

          changed=[]
          for path in HTML_FILES:
              text=path.read_text(encoding='utf-8'); original=text
              text=re.sub(r'<a\\b[^>]*(?:btn-login|login\\.html|#login)[^>]*>.*?</a>','',text,flags=re.I|re.S)
              text=anchor_re.sub(lambda m:rewrite_anchor(m,path),text)
              if path.as_posix()=='sections/platforms.html':
                  text=text.replace('href="#platforms">Compare Platforms','href="./trading/platforms.html">Compare Platforms')
                  text=text.replace('href="#platforms">\\n          <span class="download-icon">▣</span>','href="./platforms/metatrader-4.html">\\n          <span class="download-icon">▣</span>')
                  text=text.replace('href="#platforms">\\n          <span class="download-icon play">▶</span>','href="./platforms/metatrader-5.html">\\n          <span class="download-icon play">▶</span>')
                  text=text.replace('href="#platforms">\\n          <span class="download-icon">↗</span>','href="./platforms/webtrader.html">\\n          <span class="download-icon">↗</span>')
                  text=text.replace('href="#open-account">Open Account Now','href="./trading/account-opening.html">Open Account Now')
              if path.as_posix()=='sections/accounts.html':
                  for old,new in [
                      ('href="#open-account" class="fx-account-learn"','href="./accounts/standard.html" class="fx-account-learn"'),
                      ('href="#open-account" class="fx-account-learn"','href="./accounts/premium.html" class="fx-account-learn"'),
                      ('href="#open-account" class="fx-account-learn"','href="./accounts/professional.html" class="fx-account-learn"')]: text=text.replace(old,new,1)
                  text=text.replace('href="#partner" class="fx-partnership-button"','href="./partnership/account-opening.html" class="fx-partnership-button"')
                  text=text.replace('href="#top"','href="./index.html"')
              src=rel_route(path,'site-fixes.js')
              if 'site-fixes.js' not in text: text=text.replace('</body>',f'\\n<script src="{src}" defer></script>\\n</body>',1)
              if text!=original: path.write_text(text,encoding='utf-8'); changed.append(path.as_posix())
          print(json.dumps({'changed_files':changed,'count':len(changed)},indent=2))

      - name: Add shared site hardening script
        shell: bash
        run: |
          cat > site-fixes.js <<'EOF'
          (() => {
            'use strict';
            const path = window.location.pathname.replace(/\\/g, '/');
            const isHome = /\/index\.html?$/.test(path) || path.endsWith('/');
            const closeMenus = () => {
              document.querySelectorAll('.nav-item.is-open, .nav-item.open').forEach(item => item.classList.remove('is-open','open'));
              document.querySelectorAll('.main-nav.is-open, .main-nav.open').forEach(nav => nav.classList.remove('is-open','open'));
              document.querySelectorAll('.menu-toggle[aria-expanded="true"]').forEach(btn => btn.setAttribute('aria-expanded','false'));
              document.body.style.overflow='';
            };
            const installMobileNavigation = () => {
              const nav=document.querySelector('.main-nav'); const toggle=document.querySelector('.menu-toggle');
              if(!nav||!toggle||toggle.dataset.fxcBound==='1') return;
              toggle.dataset.fxcBound='1';
              toggle.addEventListener('click',e=>{e.preventDefault(); const open=nav.classList.toggle('is-open')||nav.classList.toggle('open'); toggle.setAttribute('aria-expanded',open?'true':'false'); document.body.style.overflow=open?'hidden':'';});
              nav.querySelectorAll('.nav-item > .nav-trigger').forEach(trigger=>{ if(trigger.dataset.fxcBound==='1') return; trigger.dataset.fxcBound='1'; trigger.addEventListener('click',e=>{if(window.innerWidth>850)return; e.preventDefault(); const item=trigger.closest('.nav-item'); const was=item.classList.contains('is-open')||item.classList.contains('open'); nav.querySelectorAll('.nav-item.is-open,.nav-item.open').forEach(other=>other.classList.remove('is-open','open')); if(!was)item.classList.add('is-open'); trigger.setAttribute('aria-expanded',was?'false':'true');}); });
              nav.querySelectorAll('a').forEach(link=>link.addEventListener('click',()=>{if(window.innerWidth<=850)closeMenus();}));
            };
            const markSocials=()=>document.querySelectorAll('a[aria-label]').forEach(a=>{const l=(a.getAttribute('aria-label')||'').trim().toLowerCase(); if(['facebook','x','linkedin','youtube','instagram'].includes(l)&&a.getAttribute('href')==='#')a.removeAttribute('href');});
            const addFinlogix=()=>{if(!isHome)return; const host=document.querySelector('.hero-ticker-track')||document.querySelector('.hero-ticker'); if(!host||document.getElementById('fxc-finlogix-home-strip'))return; const wrap=document.createElement('div'); wrap.id='fxc-finlogix-home-strip'; wrap.className='fxc-finlogix-home-strip'; wrap.innerHTML='<div class="finlogix-container"></div>'; host.replaceChildren(wrap); const init=()=>{if(!window.Widget||typeof window.Widget.init!=='function')return; try{window.Widget.init({widgetId:'87c63d8a-2d03-409f-ba57-599ea3a57013',type:'StripBar',language:'en',symbolPairs:[{symbolId:'19',symbolName:'EURUSD'},{symbolId:'36',symbolName:'USDJPY'},{symbolId:'20',symbolName:'GBPAUD'},{symbolId:'44',symbolName:'XAUUSD'},{symbolId:'128',symbolName:'USWTI'},{symbolId:'157',symbolName:'SP500'}],isAdaptive:true});}catch(error){console.error('FXCentrum24 Finlogix homepage strip failed:',error);}}; if(window.Widget)init(); else {const s=document.createElement('script');s.src='https://widget.finlogix.com/Widget.js';s.async=true;s.addEventListener('load',init,{once:true});document.head.appendChild(s);}};
            const init=()=>{closeMenus();installMobileNavigation();markSocials();addFinlogix();};
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();
          EOF

      - name: Verify final source
        shell: python
        run: |
          from pathlib import Path
          import re, sys, os
          root=Path('.')
          expected=['markets/forex.html','markets/commodities.html','markets/indices.html','markets/shares-cfds.html','markets/cryptocurrency.html','trading/account-types.html','trading/trading-conditions.html','trading/platforms.html','trading/how-to-start.html','trading/account-opening.html','platforms/metatrader-4.html','platforms/metatrader-5.html','platforms/webtrader.html','accounts/standard.html','accounts/premium.html','accounts/professional.html','tools/live-markets.html','tools/economic-calendar.html','company/about.html','company/contact.html','company/benefits.html','partnership/index.html','partnership/account-opening.html','legal/terms-and-conditions.html','legal/privacy-policy.html','legal/risk-disclosure.html','legal/aml-policy.html','legal/client-agreement.html']
          missing=[p for p in expected if not(root/p).exists()]
          if missing: print('Missing expected pages:',missing);sys.exit(1)
          text_files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.css'}]
          all_text='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in text_files)
          login_nav=[]
          for p in text_files:
              t=p.read_text(encoding='utf-8',errors='replace')
              if re.search(r'href\s*=\s*["\'][^"\']*login|class\s*=\s*["\'][^"\']*\bbtn-login\b',t,re.I): login_nav.append(str(p))
          if login_nav: print('Login navigation references remain:',login_nav);sys.exit(1)
          bad_hash=[]
          for p in root.rglob('*.html'):
              t=p.read_text(encoding='utf-8',errors='replace')
              for m in re.finditer(r'href\s*=\s*["\']#["\']',t,re.I): bad_hash.append(str(p))
          if bad_hash: print('Accidental href="#" remains:',bad_hash);sys.exit(1)
          for p in expected:
              t=(root/p).read_text(encoding='utf-8',errors='replace')
              if 'site-fixes.js' not in t: print('Missing site-fixes include:',p);sys.exit(1)
          sf=(root/'site-fixes.js').read_text(encoding='utf-8',errors='replace')
          if '87c63d8a-2d03-409f-ba57-599ea3a57013' not in sf or "type:'StripBar'" not in sf: print('Finlogix homepage StripBar missing');sys.exit(1)
          print(f'PASS: {len(list(root.rglob("*.html")))} HTML files checked; required routes exist; no Login navigation; no href="#" placeholders; Finlogix StripBar configured.')

      - name: Commit finalized website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to commit."; exit 0; fi
          git commit -m "Complete FXCentrum24 website navigation, legal links and mobile fixes [skip ci]"
          git push origin HEAD:main
