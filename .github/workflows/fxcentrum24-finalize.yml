name: FXCentrum24 Finalize

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production completion fixes
        shell: python
        run: |
          from pathlib import Path
          import os
          import re

          ROOT = Path('.')
          html_files = sorted(ROOT.rglob('*.html'))

          def root_context(path: Path) -> Path:
              # Homepage-injected fragments keep the browser's index.html URL as base.
              return ROOT if path.as_posix().startswith('sections/') else path.parent

          def rel_target(path: Path, target: str) -> str:
              value = os.path.relpath(ROOT / target, root_context(path)).replace('\\', '/')
              return value if value.startswith('.') else './' + value

          routes = {
              'Forex':'markets/forex.html','Commodities':'markets/commodities.html','Indices':'markets/indices.html',
              'Shares CFDs':'markets/shares-cfds.html','Shares':'markets/shares-cfds.html','Cryptocurrency':'markets/cryptocurrency.html',
              'Trade Forex':'markets/forex.html','Trade Commodities':'markets/commodities.html','Trade Indices':'markets/indices.html',
              'Trade Shares':'markets/shares-cfds.html','Trade Crypto':'markets/cryptocurrency.html',
              'Account Types':'trading/account-types.html','Trading Conditions':'trading/trading-conditions.html',
              'Platforms':'trading/platforms.html','How to Start':'trading/how-to-start.html',
              'MetaTrader 4':'platforms/metatrader-4.html','MetaTrader 5':'platforms/metatrader-5.html','WebTrader':'platforms/webtrader.html',
              'Standard':'accounts/standard.html','Premium':'accounts/premium.html','Professional':'accounts/professional.html',
              'Live Markets':'tools/live-markets.html','Economic Calendar':'tools/economic-calendar.html',
              'About Us':'company/about.html','Contact Us':'company/contact.html','Benefits':'company/benefits.html',
              'Partnership':'partnership/index.html','Become a Partner':'partnership/account-opening.html',
              'Open Account':'trading/account-opening.html','Open Account Now':'trading/account-opening.html',
              'Terms and Conditions':'legal/terms-and-conditions.html','Terms & Conditions':'legal/terms-and-conditions.html',
              'Privacy Policy':'legal/privacy-policy.html','Risk Disclosure':'legal/risk-disclosure.html','AML Policy':'legal/aml-policy.html',
              'Client Agreement':'legal/client-agreement.html','Explore All Markets':'tools/live-markets.html','View All Markets':'tools/live-markets.html'
          }

          fragment_routes = {
              'accounts':'trading/account-types.html','conditions':'trading/trading-conditions.html','platforms':'trading/platforms.html',
              'steps':'trading/how-to-start.html','markets':'tools/live-markets.html','calendar':'tools/economic-calendar.html',
              'about':'company/about.html','contact':'company/contact.html','partner':'partnership/index.html',
              'open-account':'trading/account-opening.html','benefits':'company/benefits.html'
          }

          anchor = re.compile(r'<a\\b(?P<attrs>[^>]*)>(?P<body>.*?)</a>', re.I | re.S)
          href_re = re.compile(r'''\\bhref\\s*=\\s*([\"\\'])(.*?)\\1''', re.I | re.S)
          aria_re = re.compile(r'''\\baria-label\\s*=\\s*([\"\\'])(.*?)\\1''', re.I | re.S)
          class_re = re.compile(r'''\\bclass\\s*=\\s*([\"\\'])(.*?)\\1''', re.I | re.S)

          def text_content(value: str) -> str:
              value = re.sub(r'<[^>]*>', ' ', value)
              value = re.sub(r'\\s+', ' ', value).strip()
              return value

          def rewrite_anchor(match, path: Path):
              attrs = match.group('attrs')
              body = match.group('body')
              href_match = href_re.search(attrs)
              href = href_match.group(2).strip() if href_match else ''
              aria_match = aria_re.search(attrs)
              aria = aria_match.group(2).strip() if aria_match else ''
              class_match = class_re.search(attrs)
              classes = class_match.group(2).lower() if class_match else ''
              label = aria or text_content(body)
              label_norm = re.sub(r'\\s+', ' ', label).strip().lower()

              if label_norm == 'login' or 'btn-login' in classes or 'login.html' in href.lower():
                  return ''

              if label_norm in {'facebook','x','linkedin','youtube','instagram'} and href == '#':
                  attrs = href_re.sub('', attrs, count=1).rstrip() + ' aria-disabled="true" tabindex="-1"'
                  return f'<a{attrs}>{body}</a>'

              target = None
              if re.search(r'(^|/)terms\\.html$', href, re.I):
                  target = 'legal/terms-and-conditions.html'
              elif re.search(r'(^|/)privacy\\.html$', href, re.I):
                  target = 'legal/privacy-policy.html'
              elif label in routes:
                  target = routes[label]
              elif label_norm in {k.lower() for k in routes}:
                  target = next(v for k,v in routes.items() if k.lower() == label_norm)
              elif href.startswith('#'):
                  target = fragment_routes.get(href[1:].lower())

              if target and (not href or href.startswith('#') or href.endswith('/terms.html') or href.endswith('/privacy.html')):
                  new_href = rel_target(path, target)
                  if href_match:
                      attrs = href_re.sub(lambda _: f'href="{new_href}"', attrs, count=1)
                  else:
                      attrs = f'{attrs} href="{new_href}"'
                  return f'<a{attrs}>{body}</a>'

              return match.group(0)

          changed = []
          for path in html_files:
              original = path.read_text(encoding='utf-8')
              text = original
              text = anchor.sub(lambda m: rewrite_anchor(m, path), text)

              # The three homepage account cards have distinct destinations.
              if path.as_posix() == 'sections/accounts.html':
                  text = text.replace('href="#open-account" class="fx-account-learn"', 'href="./accounts/standard.html" class="fx-account-learn"', 1)
                  text = text.replace('href="#open-account" class="fx-account-learn"', 'href="./accounts/premium.html" class="fx-account-learn"', 1)
                  text = text.replace('href="#open-account" class="fx-account-learn"', 'href="./accounts/professional.html" class="fx-account-learn"', 1)
                  text = text.replace('href="#partner" class="fx-partnership-button"', 'href="./partnership/account-opening.html" class="fx-partnership-button"')

              if path.as_posix() == 'sections/platforms.html':
                  text = text.replace('href="#platforms">Compare Platforms', 'href="./trading/platforms.html">Compare Platforms')
                  text = text.replace('href="#platforms">\n          <span class="download-icon">▣</span>', 'href="./platforms/metatrader-4.html">\n          <span class="download-icon">▣</span>')
                  text = text.replace('href="#platforms">\n          <span class="download-icon play">▶</span>', 'href="./platforms/metatrader-5.html">\n          <span class="download-icon play">▶</span>')
                  text = text.replace('href="#platforms">\n          <span class="download-icon">↗</span>', 'href="./platforms/webtrader.html">\n          <span class="download-icon">↗</span>')
                  text = text.replace('href="#open-account">Open Account Now', 'href="./trading/account-opening.html">Open Account Now')

              # Root site fixes script is loaded by every full page.
              if 'site-fixes.js' not in text:
                  src = rel_target(path, 'site-fixes.js')
                  if '</body>' in text:
                      text = text.replace('</body>', f'\n<script src="{src}" defer></script>\n</body>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(path.as_posix())

          print('Updated', len(changed), 'HTML files')

      - name: Write shared production hardening script
        shell: bash
        run: |
          cat > site-fixes.js <<'EOF'
          (() => {
            'use strict';
            const isHome = /\/index\.html?$/.test(location.pathname) || location.pathname.endsWith('/');

            const closeMenus = () => {
              document.querySelectorAll('.nav-item.is-open,.nav-item.open').forEach(el => el.classList.remove('is-open','open'));
              document.querySelectorAll('.main-nav.is-open,.main-nav.open').forEach(el => el.classList.remove('is-open','open'));
              document.querySelectorAll('.menu-toggle[aria-expanded="true"]').forEach(el => el.setAttribute('aria-expanded','false'));
              document.body.style.overflow = '';
            };

            const initNavigation = () => {
              const nav = document.querySelector('.main-nav');
              const toggle = document.querySelector('.menu-toggle');
              if (!nav || !toggle || toggle.dataset.fxcBound === '1') return;
              toggle.dataset.fxcBound = '1';
              toggle.addEventListener('click', e => {
                e.preventDefault();
                const open = !nav.classList.contains('is-open') && !nav.classList.contains('open');
                nav.classList.toggle('is-open', open);
                nav.classList.toggle('open', open);
                toggle.setAttribute('aria-expanded', String(open));
                document.body.style.overflow = open ? 'hidden' : '';
              });
              nav.querySelectorAll('.nav-item > .nav-trigger').forEach(trigger => {
                trigger.addEventListener('click', e => {
                  if (window.innerWidth > 850) return;
                  e.preventDefault();
                  const item = trigger.closest('.nav-item');
                  const wasOpen = item.classList.contains('is-open') || item.classList.contains('open');
                  nav.querySelectorAll('.nav-item.is-open,.nav-item.open').forEach(other => other.classList.remove('is-open','open'));
                  trigger.setAttribute('aria-expanded', wasOpen ? 'false' : 'true');
                  if (!wasOpen) item.classList.add('is-open');
                });
              });
              nav.querySelectorAll('a').forEach(link => link.addEventListener('click', () => { if (window.innerWidth <= 850) closeMenus(); }));
            };

            const initSocials = () => {
              document.querySelectorAll('a[aria-label]').forEach(a => {
                const label = (a.getAttribute('aria-label') || '').toLowerCase();
                if (['facebook','x','linkedin','youtube','instagram'].includes(label) && a.getAttribute('href') === '#') a.removeAttribute('href');
              });
            };

            const initFinlogixHome = () => {
              if (!isHome) return;
              const host = document.querySelector('.hero-ticker-track') || document.querySelector('.hero-ticker');
              if (!host || document.getElementById('fxc-finlogix-home-strip')) return;
              host.innerHTML = '<div id="fxc-finlogix-home-strip" class="fxc-finlogix-home-strip"><div class="finlogix-container"></div></div>';
              const init = () => {
                if (!window.Widget || typeof window.Widget.init !== 'function') return;
                window.Widget.init({
                  widgetId: '87c63d8a-2d03-409f-ba57-599ea3a57013',
                  type: 'StripBar',
                  language: 'en',
                  symbolPairs: [
                    {symbolId:'19',symbolName:'EURUSD'},
                    {symbolId:'36',symbolName:'USDJPY'},
                    {symbolId:'20',symbolName:'GBPAUD'},
                    {symbolId:'44',symbolName:'XAUUSD'},
                    {symbolId:'128',symbolName:'USWTI'},
                    {symbolId:'157',symbolName:'SP500'}
                  ],
                  isAdaptive: true
                });
              };
              if (window.Widget) init();
              else {
                const script = document.createElement('script');
                script.src = 'https://widget.finlogix.com/Widget.js';
                script.async = true;
                script.addEventListener('load', init, {once:true});
                document.head.appendChild(script);
              }
            };

            const init = () => { closeMenus(); initNavigation(); initSocials(); initFinlogixHome(); };
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init, {once:true});
            else init();
          })();
          EOF

      - name: Verify final source and every relative HTML link
        shell: python
        run: |
          from pathlib import Path
          from urllib.parse import urlsplit
          import os, re, sys

          root = Path('.')
          html_files = sorted(root.rglob('*.html'))
          expected = [
            'index.html',
            'markets/forex.html','markets/commodities.html','markets/indices.html','markets/shares-cfds.html','markets/cryptocurrency.html',
            'trading/account-types.html','trading/trading-conditions.html','trading/platforms.html','trading/how-to-start.html','trading/account-opening.html',
            'platforms/metatrader-4.html','platforms/metatrader-5.html','platforms/webtrader.html',
            'accounts/standard.html','accounts/premium.html','accounts/professional.html',
            'tools/live-markets.html','tools/economic-calendar.html',
            'company/about.html','company/contact.html','company/benefits.html',
            'partnership/index.html','partnership/account-opening.html',
            'legal/terms-and-conditions.html','legal/privacy-policy.html','legal/risk-disclosure.html','legal/aml-policy.html','legal/client-agreement.html'
          ]

          missing = [p for p in expected if not (root / p).is_file()]
          if missing:
            print('Missing expected pages:', *missing, sep='\n  ')
            sys.exit(1)

          login_nav = []
          placeholder = []
          broken = []
          href_re = re.compile(r'''<a\\b[^>]*\\bhref\\s*=\\s*([\"\\'])(.*?)\\1''', re.I | re.S)

          for path in html_files:
            text = path.read_text(encoding='utf-8', errors='replace')
            if re.search(r'''href\\s*=\\s*[\"\\'][^\"\\']*login|class\\s*=\\s*[\"\\'][^\"\\']*btn-login''', text, re.I):
              login_nav.append(str(path))
            for m in href_re.finditer(text):
              href = m.group(2).strip()
              if href == '#':
                placeholder.append(str(path))
                continue
              if href.startswith(('#','mailto:','tel:','javascript:')) or '://' in href or href.startswith('//'):
                continue
              target_part = urlsplit(href).path
              candidate = (path.parent / target_part).resolve()
              try:
                candidate.relative_to(root.resolve())
              except ValueError:
                broken.append(f'{path}: outside repo -> {href}')
                continue
              if target_part and not candidate.is_file():
                broken.append(f'{path} -> {href}')

          if login_nav:
            print('Login navigation remains:', *login_nav, sep='\n  ')
            sys.exit(1)
          if placeholder:
            print('Bare href="#" remains:', *placeholder, sep='\n  ')
            sys.exit(1)
          if broken:
            print('Broken relative links:', *broken, sep='\n  ')
            sys.exit(1)

          site = (root/'site-fixes.js').read_text(encoding='utf-8', errors='replace')
          required = ["widgetId: '87c63d8a-2d03-409f-ba57-599ea3a57013'", "type: 'StripBar'", 'https://widget.finlogix.com/Widget.js']
          missing_cfg = [x for x in required if x not in site]
          if missing_cfg:
            print('Missing Finlogix homepage config:', missing_cfg)
            sys.exit(1)

          for p in expected:
            if 'site-fixes.js' not in (root/p).read_text(encoding='utf-8', errors='replace'):
              print('Missing site-fixes include:', p)
              sys.exit(1)

          print(f'PASS: {len(html_files)} HTML files scanned; all expected pages exist; no Login navigation; no bare href="#"; no broken relative links; Finlogix homepage StripBar configured.')

      - name: Commit finalized website
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete FXCentrum24 website navigation, legal links and mobile fixes [skip ci]"
          git push origin HEAD:main
