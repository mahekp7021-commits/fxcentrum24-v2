<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{width:100%;margin:0;padding:0;background:#fff;overflow:visible}
.finlogix-container{width:100%;height:auto;min-height:0}
</style>
</head>
<body>
<div class="finlogix-container"></div>
<script src="https://widget.finlogix.com/Widget.js"></script>
<script>
Widget.init({
  widgetId:"87c63d8a-2d03-409f-ba57-599ea3a57013",
  type:"BigChart",
  language:"en",
  symbolName:"Apple",
  hasSearchBar:false,
  hasSymbolName:false,
  hasSymbolChange:false,
  hasButton:false,
  chartShape:"candles",
  timePeriod:"D1",
  isAdaptive:true
});
(function(){
  function fit(){
    var h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,document.documentElement.offsetHeight,document.body.offsetHeight);
    if(h>0 && window.frameElement) window.frameElement.style.height=Math.ceil(h)+'px';
  }
  if(window.ResizeObserver){
    new ResizeObserver(fit).observe(document.documentElement);
    new ResizeObserver(fit).observe(document.body);
  }
  [100,300,700,1200,2000].forEach(function(ms){setTimeout(fit,ms);});
  window.addEventListener('load',fit);
})();
</script>
</body>
</html>
